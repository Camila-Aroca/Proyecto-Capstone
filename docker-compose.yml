name: saad

services:
  api:
    build:
      context: .
      target: api
    image: saad-api
    restart: unless-stopped
    volumes:
      # Se monta data/ completo: al arrancar, la API tambien lee RAW de Urgencias
      # y poblacion para el holdout reciente.
      - ./data:/app/data:ro
      - ./reports:/app/reports:ro
    ports:
      - "${SAAD_API_PORT:-8000}:8000"

  web:
    build: ./frontend
    image: saad-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${SAAD_WEB_PORT:-8080}:80"

  # Pipeline completo sobre el volumen local: docker compose --profile pipeline run --rm pipeline
  # Actualizacion semanal: ... run --rm pipeline python -m src.cloud.pipeline_task --modo semanal
  # Con SAAD_S3_BUCKET definido trabaja contra S3, igual que la tarea programada en Fargate.
  pipeline:
    build:
      context: .
      target: pipeline
    image: saad-pipeline
    profiles: ["pipeline"]
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    command: ["python", "-m", "src.cloud.pipeline_task", "--modo", "completo"]
